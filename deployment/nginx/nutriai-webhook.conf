# Nginx configuration for NutriAI Telegram Bot (Webhook Mode)
# Place this file in /etc/nginx/sites-available/nutriai-webhook.conf
# Then create symlink: sudo ln -s /etc/nginx/sites-available/nutriai-webhook.conf /etc/nginx/sites-enabled/

upstream nutriai_bot {
    # Backend - бот слушает на localhost:8443
    server 127.0.0.1:8443;

    # Для нескольких инстансов (load balancing):
    # server 127.0.0.1:8443;
    # server 127.0.0.1:8444;
    # server 127.0.0.1:8445;

    # Health check настройки
    keepalive 32;
}

# HTTP → HTTPS редирект
server {
    listen 80;
    listen [::]:80;
    server_name bot.example.com;  # ← Замените на ваш домен

    # Certbot validation (для получения SSL сертификата)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.example.com;  # ← Замените на ваш домен

    # === SSL CERTIFICATES ===
    # Let's Encrypt certificates (автоматически обновляются)
    ssl_certificate /etc/letsencrypt/live/bot.example.com/fullchain.pem;  # ← Замените домен
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;  # ← Замените домен

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # SSL Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/bot.example.com/chain.pem;  # ← Замените домен

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # === LOGGING ===
    access_log /var/log/nginx/nutriai-bot-access.log;
    error_log /var/log/nginx/nutriai-bot-error.log warn;

    # === WEBHOOK ENDPOINT ===
    location /webhook {
        # Проксируем на бота
        proxy_pass http://nutriai_bot;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты (Telegram может слать долгие запросы)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;

        # Размер тела запроса (для больших обновлений)
        client_max_body_size 10M;

        # IP Whitelist (опционально - только Telegram IP)
        # allow 149.154.160.0/20;
        # allow 91.108.4.0/22;
        # deny all;
    }

    # === HEALTH CHECK ENDPOINT (опционально) ===
    location /health {
        proxy_pass http://nutriai_bot;
        access_log off;
    }

    # === METRICS ENDPOINT (если используете Prometheus) ===
    location /metrics {
        proxy_pass http://nutriai_bot;

        # Защита паролем (опционально)
        # auth_basic "Metrics";
        # auth_basic_user_file /etc/nginx/.htpasswd;

        # Или IP whitelist
        # allow 192.168.1.0/24;
        # deny all;
    }

    # Deny all other requests
    location / {
        return 404;
    }
}
