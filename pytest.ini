[pytest]
# Pytest configuration for NutriAI Bot

# Python files to scan for tests
python_files = test_*.py *_test.py

# Python classes to scan for tests
python_classes = Test*

# Python functions to scan for tests
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    db: marks tests that require database
    api: marks tests that require external APIs

# Output options
console_output_style = progress
log_cli = true
log_cli_level = INFO

# Asyncio configuration
asyncio_mode = auto

# Coverage options (if pytest-cov is installed)
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings

# Timeout for tests (requires pytest-timeout)
# timeout = 300

# Minimum Python version
minversion = 3.11
